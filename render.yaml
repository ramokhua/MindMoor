services:
  - type: web
    name: mindmoor-backend
    root: backend
    runtime: python
    runtimeVersion: 3.9
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:create_app()
    envVars:
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        scope: runtime
      - key: BASE_MODEL
        value: facebook/blenderbot-400M-distill
      - key: MAX_NEW_TOKENS
        value: "200"
      - key: MODEL_TEMPERATURE
        value: "0.75"
      - key: RATE_LIMIT
        value: "30"
      - key: RATE_WINDOW
        value: "60"
    healthCheckPath: /api/health